apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: tomato
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: ravibhadarge/tomato-auth:v1.0.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: tomato-config
        - secretRef:
            name: tomato-secret
---
