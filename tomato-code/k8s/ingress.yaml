apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tomato-ingress
  namespace: tomato
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: 5000

      - path: /api/restaurant
        pathType: Prefix
        backend:
          service:
            name: restaurant
            port:
              number: 5001

      - path: /api/utils
        pathType: Prefix
        backend:
          service:
            name: utils
            port:
              number: 5002

      - path: /api/realtime
        pathType: Prefix
        backend:
          service:
            name: realtime
            port:
              number: 5004

      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: realtime
            port:
              number: 5004

      - path: /api/rider
        pathType: Prefix
        backend:
          service:
            name: rider
            port:
              number: 5005

      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 5006
